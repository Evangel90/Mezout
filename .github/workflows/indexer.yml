# Backstop for Mezout's scheduled run (records new payments, announces expiries, sends due webhooks and alerts).
# The primary scheduler is cron-job.org every 5 minutes (docs/DEVELOPMENT.md): GitHub's 5-minute schedule in
# practice runs hours apart. Runs are idempotent, so overlapping calls are safe.
name: Indexer
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -m 90 -H "Authorization: Bearer $CRON_SECRET" https://usemezout.vercel.app/api/cron
